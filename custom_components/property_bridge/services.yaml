apply_checkin_preset:
  name: Apply check-in preset
  description: Run the configured check-in script and/or scene. Target by entry_id, property_name, or calendar_entity_id.
  fields:
    entry_id:
      name: Property entry ID
      required: false
      selector:
        text:
    property_name:
      name: Property name
      required: false
      selector:
        text:
    calendar_entity_id:
      name: Calendar entity
      description: Calendar linked to this property in options.
      required: false
      selector:
        entity:
          domain: calendar

apply_checkout_preset:
  name: Apply check-out preset
  description: Run the configured check-out script and/or scene. Target by entry_id, property_name, or calendar_entity_id.
  fields:
    entry_id:
      name: Property entry ID
      required: false
      selector:
        text:
    property_name:
      name: Property name
      required: false
      selector:
        text:
    calendar_entity_id:
      name: Calendar entity
      required: false
      selector:
        entity:
          domain: calendar

request_maintenance_window:
  name: Request maintenance window
  description: Open a time-limited maintenance window (respects consent setting).
  fields:
    entry_id:
      name: Property entry ID
      required: false
      selector:
        text:
    property_name:
      name: Property name
      required: false
      selector:
        text:
    calendar_entity_id:
      name: Calendar entity
      required: false
      selector:
        entity:
          domain: calendar
    hours:
      name: Duration (hours)
      required: false
      selector:
        number:
          min: 1
          max: 168
          unit_of_measurement: hours

end_maintenance_window:
  name: End maintenance window
  description: Close the maintenance window and revoke consent.
  fields:
    entry_id:
      name: Property entry ID
      required: false
      selector:
        text:
    property_name:
      name: Property name
      required: false
      selector:
        text:

grant_maintenance_consent:
  name: Grant maintenance consent
  description: Grant consent so a maintenance window can be opened.
  fields:
    entry_id:
      name: Property entry ID
      required: false
      selector:
        text:
    property_name:
      name: Property name
      required: false
      selector:
        text:

call_remote_service:
  name: Call remote service
  description: Call any service on the remote Home Assistant for this property.
  fields:
    entry_id:
      name: Property entry ID
      required: true
      selector:
        text:
    domain:
      name: Domain
      required: true
      selector:
        text:
    service:
      name: Service
      required: true
      selector:
        text:
    service_data:
      name: Service data
      required: false
      selector:
        object:

trigger_automation:
  name: Trigger automation
  description: Trigger a mirrored remote automation from the central instance.
  fields:
    entry_id:
      name: Property entry ID
      required: true
      selector:
        text:
    entity_id:
      name: Automation entity
      required: true
      selector:
        entity:
          domain: automation
    skip_condition:
      name: Skip conditions
      required: false
      selector:
        boolean:

list_automations:
  name: List automations
  description: List all mirrored automations for a property (returns response data).
  fields:
    entry_id:
      name: Property entry ID
      required: true
      selector:
        text:

get_automation_config:
  name: Get automation config
  description: Fetch the full automation config from the remote instance.
  fields:
    entry_id:
      name: Property entry ID
      required: true
      selector:
        text:
    automation_id:
      name: Automation ID
      required: true
      selector:
        text:

update_automation_config:
  name: Update automation config
  description: Create or update an automation on the remote instance.
  fields:
    entry_id:
      name: Property entry ID
      required: true
      selector:
        text:
    automation_id:
      name: Automation ID
      required: true
      selector:
        text:
    config:
      name: Config
      required: true
      selector:
        object:

list_properties:
  name: List properties
  description: List all Property Bridge properties with connection status (response data).

get_portfolio_status:
  name: Get portfolio status
  description: Bulk health summary for every property (connected count, entity totals, errors).
